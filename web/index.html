<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>СельРиск · карта Алматы</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="map.css">
</head>
<body>
<main class="map-app">
  <div id="map" aria-label="Карта селевых очагов вокруг Алматы"></div>
  <header class="map-header">
    <a class="brand" href="index.html">СельРиск <span>Алматы</span></a>
    <span class="map-subtitle">Карта модельной вероятности</span>
    <form id="date-form" class="date-controls">
      <button type="button" id="today">Сегодня</button>
      <button type="button" id="tomorrow">Завтра</button>
      <label for="date">Дата</label><input id="date" type="date" required>
      <button type="submit" id="calculate">Показать</button>
    </form>
  </header>
  <aside class="map-readout" aria-live="polite">
    <div id="day-label">Загрузка карты</div>
    <strong id="region-probability">—</strong>
    <span>Условная оценка для региона за сутки</span>
    <p id="status">Загружаем модель и географию…</p>
  </aside>
  <aside class="map-legend" aria-label="Цветовая шкала">
    <b>Вероятность в очаге, %</b>
    <div class="color-ramp"></div>
    <div class="legend-values"><span>0,0001</span><span>0,001</span><span>0,01</span><span>0,1</span><span>1+</span></div>
    <p>Условная модель: 300 дней без записей приняты за бесселевые. Пространство: историческая частота очагов.</p>
    <small id="weather-source">Погода: —</small>
  </aside>
  <button id="reset-map" class="reset-map" type="button" aria-label="Вернуть карту к Алматы">К Алматы</button>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="model.js"></script><script src="map-app.js"></script>
</body></html>
