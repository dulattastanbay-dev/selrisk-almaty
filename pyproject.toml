[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "selrisk-almaty"
version = "0.2.0"
description = "Историческое исследование селей Алматы: реальные данные и presence-background ранжирование"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "requests>=2.28",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
realdata = ["cdsapi>=0.6", "xarray>=2023.1", "netCDF4>=1.6", "rasterio>=1.3"]
dev = ["pytest>=7.0"]

[project.scripts]
selrisk-research = "selrisk.research:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
