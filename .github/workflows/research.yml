name: Real dataset and research workflow
on: [push, pull_request]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -e '.[dev,app,dataset]' -c requirements-research.txt
      - run: python scripts/run_all.py
      - run: pytest -q
      - run: pytest -q data/real/v0.2/tests
      - name: Export must reproduce committed real-data results
        run: git diff --exit-code -- web/data
      - uses: actions/upload-artifact@v4
        with:
          name: research-results-v02
          path: data/outputs/research/
